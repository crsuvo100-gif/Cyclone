# Cyclone — GitHub Actions CI

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "requirements.txt"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy
          ruff check app/ tests/ || true
          mypy app/ --strict --ignore-missing-imports || true

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "requirements.txt"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Install the repo package (with its packaged data files) BEFORE pytest,
          # so the test suite imports the shipped app package instead of a stale
          # environment copy that is missing the data files.
          pip install -e .
          python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan
        continue-on-error: true
        run: |
          echo "🔒 Secrets scan: the zricky/absolomb-security-scan action is not available in this environment (external action unresolved), automated scan skipped."
          echo "Run the scan locally or in an org where the action is registered."
